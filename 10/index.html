<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#295661" />
    <meta

      content="Caustic. A sunken observatory of light. An interactive, procedural Codevember experiment."

    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {

  <body>
    <main>
      <canvas
        tabindex="0"
        aria-label="A glass sphere suspended in a sunken stone rotunda. Drag to orbit, scroll to zoom, double click to ripple the water. Space pauses."
      ></canvas>
    </main>
    <header>
      <span>CODEVEMBER 2026 / 10 / CAUSTIC</span>

    </header>
    <footer>
      <nav aria-label="Experiment controls">
        <button id="ripple">Ripple</button>
        <button id="view">Change view</button>
        <button id="pause" aria-label="Pause animation">Pause</button>

    <div id="status" role="status">Gathering the light…</div>
    <script type="module" src="bootstrap.js"></script>
